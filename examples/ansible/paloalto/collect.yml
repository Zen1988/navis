---
- name: Collect selected firewall evidence through Panorama
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    panorama_output_dir: ./panorama-output
    # The caller supplies firewall serials. Native hierarchy and pushed data
    # provide policy context; successful collection does not prove deployment.
    panorama_queries:
      - name: panorama-config
        form: {type: config, action: show, xpath: '/config'}
      - name: device-group-hierarchy
        form: {type: op, cmd: '<show><dg-hierarchy></dg-hierarchy></show>'}
    pan_queries:
      # Full running configuration preserves VSYS and shared-object ancestry.
      # Protect this file: unrelated device configuration can contain secrets.
      - name: running-config
        form: {type: config, action: show, xpath: '/config'}
      - name: pushed-config
        form: {type: config, action: get, xpath: '/config/panorama'}
      - name: applications
        form: {type: config, action: get, xpath: '/config/predefined/application'}
      - name: routes
        form: {type: op, cmd: '<show><routing><route></route></routing></show>'}
      - name: system-info
        form: {type: op, cmd: '<show><system><info></info></system></show>'}
      - name: security-rulebase
        form: {type: config, action: show, xpath: '/config/devices/entry/vsys/entry/rulebase/security'}
      - name: nat-rulebase
        form: {type: config, action: show, xpath: '/config/devices/entry/vsys/entry/rulebase/nat'}
      - name: address-objects
        form: {type: config, action: show, xpath: '/config/devices/entry/vsys/entry/address'}
      - name: address-groups
        form: {type: config, action: show, xpath: '/config/devices/entry/vsys/entry/address-group'}
      - name: service-objects
        form: {type: config, action: show, xpath: '/config/devices/entry/vsys/entry/service'}
      - name: service-groups
        form: {type: config, action: show, xpath: '/config/devices/entry/vsys/entry/service-group'}
      - name: zones
        form: {type: config, action: show, xpath: '/config/devices/entry/vsys/entry/zone'}
      - name: interfaces
        form: {type: config, action: show, xpath: '/config/devices/entry/network/interface'}
  tasks:
    - name: Validate input
      ansible.builtin.assert:
        that:
          - panorama_host is defined
          - panorama_api_key is defined
          - firewall_serials is defined
          - firewall_serials | length > 0
        quiet: true
      no_log: true

    - name: Create protected output directory
      ansible.builtin.file:
        path: "{{ panorama_output_dir }}"
        state: directory
        mode: '0700'

    - name: Read native Panorama hierarchy and configuration without a firewall target
      ansible.builtin.uri:
        url: "https://{{ panorama_host }}/api/"
        method: POST
        headers:
          X-PAN-KEY: "{{ panorama_api_key }}"
        body_format: form-urlencoded
        body: "{{ item.form }}"
        validate_certs: true
        return_content: true
        status_code: 200
      loop: "{{ panorama_queries }}"
      register: panorama_results
      no_log: true

    - name: Verify native Panorama responses
      ansible.builtin.assert:
        that:
          - item.content is search('status="success"')
      loop: "{{ panorama_results.results }}"
      no_log: true

    - name: Save native Panorama responses
      ansible.builtin.copy:
        dest: "{{ panorama_output_dir }}/{{ item.item.name }}.xml"
        mode: '0600'
        content: "{{ item.content }}"
      loop: "{{ panorama_results.results }}"
      no_log: true

    - name: Collect each targeted firewall
      ansible.builtin.include_tasks: firewall.yml
      loop: "{{ firewall_serials }}"
      loop_control:
        loop_var: firewall_serial

    - name: Save metadata
      ansible.builtin.copy:
        dest: "{{ panorama_output_dir }}/metadata.json"
        mode: '0600'
        content: "{{ {'collected_at': ansible_date_time.iso8601, 'firewall_serials': firewall_serials, 'coverage': 'partial', 'reason': 'selected targeted queries only; effective policy and operational routing not established'} | to_nice_json }}"
