---
- name: Submit an example normalized interface collection to Navis
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Replace this fixture with values derived from a vendor-specific response.
    normalized_interfaces:
      entries:
        - name: Ethernet1/1
          native_id: Ethernet1/1
          kind: physical
          vrf: default
          operational_state: up
          addresses:
            - 192.0.2.1/24
          vlans: [100]
          config: {}
  tasks:
    - name: Submit normalized data
      ansible.builtin.uri:
        url: "{{ navis_url }}/v1/ingestions"
        method: POST
        headers:
          Authorization: "Bearer {{ navis_token }}"
        body_format: json
        body:
          source:
            namespace: "{{ navis_source_namespace }}"
            external_device_id: "{{ navis_external_device_id }}"
          adapter:
            name: navis
            input_format: normalized-json
            format_version: "1"
          data_type: interface
          collected_at: "{{ navis_collected_at }}"
          completeness: partial
          payload: "{{ normalized_interfaces }}"
        status_code: 202
        validate_certs: true
      register: navis_submission
      no_log: true

    - name: Show ingestion identifier and state
      ansible.builtin.debug:
        msg: "Ingestion {{ navis_submission.json.ingestion_id }}: {{ navis_submission.json.status }}"
