<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Navis test console</title>
<style>body{font:16px system-ui;background:#f4f7fa;color:#172c3d;margin:0}main{max-width:900px;margin:auto;padding:2rem}h1{margin-bottom:.25rem}section{background:white;padding:1.5rem;border-radius:10px;margin:1rem 0;box-shadow:0 2px 12px #122c4010}label{display:block;margin:.8rem 0 .3rem}input,select,textarea{box-sizing:border-box;width:100%;padding:.65rem;border:1px solid #aebec9;border-radius:5px;font:inherit}button{background:#146379;color:white;border:0;border-radius:5px;padding:.7rem 1rem;margin-top:1rem;cursor:pointer}pre{overflow:auto;background:#102b3a;color:#e0f4f2;padding:1rem;border-radius:5px;white-space:pre-wrap}small{color:#526b78}</style></head>
<body><main><h1>Navis test console</h1><p>Submit a trace or inspect an existing graph.</p>
<section><label for="token">Bearer token</label><input id="token" type="password" autocomplete="off"><small>Used for this request only; not saved by this page.</small></section>
<section><h2>Trace connectivity</h2><label for="build">Graph build UUID</label><input id="build" placeholder="Graph build UUID"><label for="session">Caller session ID</label><input id="session" placeholder="Unique session ID"><label for="source">Source IPs</label><textarea id="source" rows="2" placeholder="10.0.0.1, 10.0.0.2"></textarea><label for="destination">Destination IPs</label><textarea id="destination" rows="2" placeholder="10.1.0.1; 10.1.0.2"></textarea><label for="protocol">Protocol</label><select id="protocol"><option>tcp</option><option>udp</option><option>icmp</option><option>icmpv6</option></select><label for="port">Destination port (optional)</label><input id="port" type="number" min="0" max="65535"><button id="trace">Run trace</button> <button id="graph">Read graph</button> <button id="recommendations">Get recommendation draft</button></section>
<section><h2>Response</h2><pre id="result" aria-live="polite">No request sent.</pre></section></main>
<script>
const el=id=>document.getElementById(id); async function call(path,options={}) { const headers={...options.headers}; if(el('token').value) headers.Authorization='Bearer '+el('token').value; try {const response=await fetch(path,{...options,headers}); const text=await response.text(); let data; try {data=JSON.parse(text)} catch {data=text} el('result').textContent=JSON.stringify({http_status:response.status,body:data},null,2)} catch(error){el('result').textContent='Request failed: '+error.message} }
el('trace').onclick=()=>{const body={graph_build_id:el('build').value,caller_session_id:el('session').value,source:el('source').value,destination:el('destination').value,protocol:el('protocol').value,destination_port:el('port').value===''?null:Number(el('port').value)};call('/v1/traces',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})};
el('graph').onclick=()=>call('/v1/graph-builds/'+encodeURIComponent(el('build').value)+'/graph');
el('recommendations').onclick=()=>call('/v1/trace-sessions/'+encodeURIComponent(el('session').value)+'/recommendations');
</script></body></html>
