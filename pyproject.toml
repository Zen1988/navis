[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navis-common"
version = "0.1.0"
description = "Shared connectivity analysis primitives for Navis"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]
